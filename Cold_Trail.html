 ctx.beginPath();path(grat);ctx.strokeStyle="rgba(120,160,210,.12)";ctx.lineWidth=.6;ctx.stroke();


 const sh=["#27456f","#2e4f80","#223c62"];
 for(const f of feats){ctx.beginPath();path(f.geo);ctx.fillStyle=f.o<0?"#1c2f4d":vis.get(f.o)||sh[f.o%3];ctx.fill()}
 ctx.beginPath();for(const f of feats)path(f.geo);ctx.strokeStyle="rgba(205,225,250,.65)";ctx.lineWidth=.8;ctx.stroke();
 ctx.lineWidth=1.8;ctx.strokeStyle="#f2b441";ctx.setLineDash([5,5]);
 for(const s of segs){ctx.beginPath();path({type:"LineString",coordinates:s});ctx.stroke()}
 if(part){ctx.beginPath();path({type:"LineString",coordinates:part});ctx.stroke()}
 ctx.setLineDash([]);ctx.font="700 11px 'Courier Prime',monospace";
 for(const m of marks){if(d3.geoDistance(m.ll,center)>1.5)continue;const q=proj(m.ll);
  ctx.beginPath();ctx.arc(q[0],q[1],4,0,7);ctx.fillStyle=m.win?"#4cc38a":m.n=="HQ"?"#dfe7f2":"#f2b441";ctx.fill();
  ctx.fillStyle="#dfe7f2";ctx.fillText(m.n,q[0]+7,q[1]+4)}
 if(pulse){const q=proj(pulse.ll),r=pulse.t*34;ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.strokeStyle=`rgba(242,180,65,${1-pulse.t})`;ctx.lineWidth=2;ctx.stroke()}
 if(plane){ctx.save();ctx.translate(plane.x,plane.y);ctx.rotate(plane.a+Math.PI/2);ctx.scale(1.35,1.35);ctx.translate(-12,-12);ctx.shadowColor="#f2b441";ctx.shadowBlur=14;ctx.fillStyle="#fff";ctx.fill(PL);ctx.restore()}
}
function frames(ms,fn){return new Promise(res=>{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);fn(k);draw();k<1?requestAnimationFrame(f):res()})(t0)})}
async function fly(a,b){
 const it=d3.geoInterpolate(a,b),ms=1100+d3.geoDistance(a,b)*1000,ease=d3.easeCubicInOut;
 await frames(ms,k=>{const e=ease(k),p=it(e),q=it(Math.min(1,e+.01));
  center=d3.geoInterpolate(center,p)(.14);
  part=[a];for(let i=1;i<=24;i++)part.push(it(e*i/24));
  const pp=proj(p),qq=proj(q);plane={x:pp[0],y:pp[1],a:Math.atan2(qq[1]-pp[1],qq[0]-pp[0])}});
 plane=null;part=null;segs.push([a,b]);
 await frames(500,k=>{center=d3.geoInterpolate(center,b)(.2);pulse={ll:b,t:k}});pulse=null;draw()}
// game
const $=id=>document.getElementById(id),log=$("log"),inp=$("in"),msg=$("msg");
$("cl").innerHTML=C.map(c=>`<option value="${c.n}">`).join("");
let guesses=[],over=false,busy=false;
const key="coldtrail-"+day;
function save(){try{localStorage.setItem(key,JSON.stringify(guesses))}catch(e){}}
function card(G,n,win,h){
 const el=document.createElement("div");el.className="card"+(win?" win":"");
 if(win){el.innerHTML=`<h3>#${n} ${G.n}: SUSPECT APPREHENDED</h3><p>Case closed in ${n} flight${n>1?"s":""}.${T.k?" "+T.k+".":""}</p><p><button class="ghost" id="sh">Copy result</button></p>`}
 else{el.innerHTML=`<h3>#${n} Landed in ${G.n}</h3>`+h.map(x=>`<p class="${x.startsWith("Intel")?"intel":""}">${x}</p>`).join("")}
 log.prepend(el);
 if(win)$("sh").onclick=()=>{const t=`🕵️ Cold Trail #${day}\nSolved in ${n} flight${n>1?"s":""}\n${"🛫".repeat(n-1)}🎯`;try{navigator.clipboard.writeText(t);$("sh").textContent="Copied!"}catch(e){$("sh").textContent="Copy failed"}}
}
async function add(G,anim,sv){
 const n=guesses.length+1,ll=[G.lon,G.lat],win=G==T,hh=win?{h:[],t:[]}:sv||pick(G,n);if(sv&&sv.h.some(x=>x.startsWith("Intel")))tc++;guesses.push({g:G.n,h:hh.h,t:hh.t});hh.t.forEach(i=>used.add(i));save();
 if(anim)await fly(pos,ll);else{segs.push([pos,ll]);center=ll}
 pos=ll;marks.push({n:G.n,ll,win});vis.set(C.indexOf(G),win?"#4cc38a":"#b9822b");draw();
 $("badge").textContent="FLIGHTS: "+n;card(G,n,win,hh.h);
 if(win){over=true;inp.disabled=$("go").disabled=true;inp.placeholder="Case closed. Come back tomorrow."}}
async function submit(){
 if(over||busy)return;const G=C.find(c=>c.n.toLowerCase()==inp.value.trim().toLowerCase());
 if(!G){msg.textContent="Unknown country. Pick one from the list.";return}
 if(guesses.some(x=>x.g==G.n)){msg.textContent="You’ve already searched there.";return}
 msg.textContent="";inp.value="";busy=true;$("go").disabled=true;await add(G,true);busy=false;if(!over)$("go").disabled=false}
$("go").onclick=submit;inp.addEventListener("keydown",e=>{if(e.key=="Enter")submit()});
let drag=null,vel=[0,0];cv.style.touchAction="none";cv.style.cursor="grab";
const clampLat=v=>Math.max(-85,Math.min(85,v));
cv.addEventListener("pointerdown",e=>{if(busy)return;drag={x:e.clientX,y:e.clientY};vel=[0,0];cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",e=>{if(!drag)return;const k=R2D/(Math.min(W,H)*.45*zoom),dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;vel=[-dx*k,dy*k];center=[center[0]+vel[0],clampLat(center[1]+vel[1])];draw()});
const endDrag=()=>{if(!drag)return;drag=null;cv.style.cursor="grab";(function f(){if(drag||busy||Math.abs(vel[0])+Math.abs(vel[1])<.05)return;center=[center[0]+vel[0],clampLat(center[1]+vel[1])];vel=vel.map(v=>v*.94);draw();requestAnimationFrame(f)})()};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
const pts=new Map(),zc=v=>Math.max(1,Math.min(8,v));let pd=0;
cv.addEventListener("pointerdown",e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){drag=null;pd=0}});
cv.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size==2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)zoom=zc(zoom*d/pd);pd=d;draw()}});
const pUp=e=>{pts.delete(e.pointerId);pd=0};cv.addEventListener("pointerup",pUp);cv.addEventListener("pointercancel",pUp);
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=zc(zoom*Math.exp(-e.deltaY*.0015));draw()},{passive:false});
$("zi").onclick=()=>{zoom=zc(zoom*1.4);draw()};$("zo").onclick=()=>{zoom=zc(zoom/1.4);draw()};
size();addEventListener("resize",()=>{size();draw()});
try{const s=JSON.parse(localStorage.getItem(key)||"[]");(async()=>{for(const x of s){const G=C.find(c=>c.n==x.g);if(G)await add(G,false,{h:x.h,t:x.t})}})()}catch(e){}
draw();if(!window.WT)msg.textContent="Map data failed to load; try refreshing.";
</script></body></html>
